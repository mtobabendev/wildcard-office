<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Penny's Office</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff4fb7;
      --pink2: #ff9bd8;
      --bg: #05050a;
      --panel: rgba(12,6,18,0.97);
      --text: #fff5fb;
      --muted: #d8c8e2;
      --tab-w: 78px;
      --bar-w: min(780px, 96vw);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      overflow-x: hidden;
    }

    .office {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
    }
    .office h1 {
      font-size: clamp(1.6rem, 8vw, 3rem);
      letter-spacing: 0.1em;
      color: var(--pink2);
      text-shadow: 0 0 20px rgba(255,79,183,0.5);
    }
    .office p { margin-top: 12px; color: var(--muted); font-size: 0.9rem; }

    /* TAB */
    .tab {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--tab-w);
      height: 100svh;
      z-index: 100;
      border: none;
      background: #000;
      padding: 0;
      cursor: pointer;
      border-radius: 14px 0 0 14px;
      overflow: hidden;
      transition: width 0.45s cubic-bezier(0.22,1,0.36,1),
                  transform 0.45s cubic-bezier(0.22,1,0.36,1);
    }
    .tab img,
    .tab video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .tab video { display: none; }

    body.open .tab {
      width: min(420px, 50vw);
      transform: translateX(calc(-1 * var(--bar-w) + 8px));
    }
    body.open .tab img { display: none; }
    body.open .tab video {
      display: block;
      object-fit: contain;
    }

    /* BAR */
    .bar {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--bar-w);
      height: 100svh;
      background: var(--panel);
      border-left: 1px solid rgba(255,79,183,0.4);
      z-index: 90;
      transform: translateX(100%);
      transition: transform 0.45s cubic-bezier(0.22,1,0.36,1);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .bar.open { transform: translateX(0); }

    .bar::-webkit-scrollbar { width: 8px; }
    .bar::-webkit-scrollbar-track { background: rgba(20,8,30,0.8); }
    .bar::-webkit-scrollbar-thumb {
      background: var(--pink);
      border-radius: 4px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { background: #ff4fb7; box-shadow: 0 0 6px #ff4fb7; }
      50% { background: #ff9bd8; box-shadow: 0 0 14px #ff9bd8; }
    }
    .bar {
      scrollbar-width: thin;
      scrollbar-color: #ff4fb7 rgba(20,8,30,0.8);
    }

    .header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,79,183,0.25);
      position: sticky;
      top: 0;
      background: var(--panel);
      z-index: 5;
    }
    .header .mark {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--pink);
      display: grid;
      place-items: center;
      color: var(--pink2);
      font-size: 1.2rem;
    }
    .header h2 {
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink2);
    }
    .header span {
      display: block;
      font-size: 0.6rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .typewriter {
      padding: 18px 20px;
      font-family: 'Dancing Script', 'Pacifico', cursive;
      font-size: 1.25rem;
      line-height: 1.6;
      min-height: 160px;
      border-bottom: 1px solid rgba(255,79,183,0.2);
      color: #ff9bd8;
      animation: colorPulse 3.5s ease-in-out infinite;
    }
    .typewriter span {
      border-right: 2px solid currentColor;
      animation: blink 0.8s step-end infinite;
      white-space: pre-wrap;
    }
    @keyframes colorPulse {
      0%, 100% { color: #ff4fb7; text-shadow: 0 0 8px #ff4fb7; }
      33% { color: #c084fc; text-shadow: 0 0 10px #c084fc; }
      66% { color: #60a5fa; text-shadow: 0 0 10px #60a5fa; }
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }

    .red-pill {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 22px;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(225,29,72,0.5);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .red-pill:hover {
      transform: scale(1.05);
      box-shadow: 0 0 18px rgba(225,29,72,0.7);
    }

    .vid-top, .vid-bottom {
      width: 100%;
      background: #000;
    }
    .vid-top video, .vid-bottom video {
      display: block;
      width: 100%;
      height: auto;
    }

    .orbit-stage {
      position: relative;
      height: 150px;
      perspective: 800px;
      background: #000;
      overflow: hidden;
    }
    .orbit {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      animation: spin 20s linear infinite;
    }
    @keyframes spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
    .card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 68px;
      height: 92px;
      margin: -46px 0 0 -34px;
      border: 1px solid rgba(255,155,216,0.5);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,79,183,0.25), rgba(9,4,14,0.9));
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 0.52rem;
      color: var(--pink2);
      backface-visibility: hidden;
    }
    .card .ico { font-size: 1.25rem; margin-bottom: 3px; }

    .footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255,79,183,0.25);
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Erica – floating outside the bar */
    .erica-slot {
      position: fixed;
      left: 14px;
      bottom: 14px;
      width: min(220px, 26vw);
      z-index: 95;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(192,132,252,0.55);
      box-shadow: 0 0 20px rgba(192,132,252,0.5);
      opacity: 0;
      transform: translate(-50px, 30px) scale(0.35) rotate(-10deg);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    body.open .erica-slot {
      opacity: 1;
      transform: translate(0, 0) scale(1) rotate(0deg);
      pointer-events: auto;
    }
    .erica-slot video {
      display: block;
      width: 100%;
      height: auto;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    body.open .overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== MOBILE FIRST OVERRIDES ===== */
    @media (max-width: 600px) {
      :root {
        --tab-w: 58px;
        --bar-w: 100vw;
      }

      body.open .tab {
        width: min(260px, 68vw);
      }

      .orbit-stage {
        height: 110px;
      }

      .typewriter {
        font-size: 1.05rem;
        padding: 14px 16px;
        min-height: 140px;
      }

      .erica-slot {
        left: 10px;
        bottom: 110px;
        width: min(150px, 38vw);
        z-index: 95;
      }
    }

    @media (max-width: 400px) {
      .erica-slot {
        bottom: 100px;
        width: min(130px, 42vw);
      }
    }
  </style>
</head>
<body>

  <main class="office">
    <div>
      <h1>PENNY'S OFFICE</h1>
      <p>A Different Approach</p>
      <p style="margin-top:16px;font-size:0.75rem;opacity:0.7">Tap the Penny tab on the right</p>
    </div>
  </main>

  <!-- Erica – outside the bar, floating lower-left -->
  <div class="erica-slot" id="ericaSlot">
    <video src="assets/penny/EricaHelpsOut.mp4" muted loop playsinline id="ericaVideo"></video>
  </div>

  <div class="overlay" id="overlay"></div>

  <aside class="bar" id="bar">
    <div class="header">
      <div class="mark">♠</div>
      <div>
        <h2>WildCard DEV</h2>
        <span>Assist Bar // Tools & Help</span>
      </div>
    </div>

    <div class="typewriter">
      <span id="typeText"></span>
      <br>
      <a href="#" class="red-pill" id="redPill" style="display:none;">the red pill</a>
    </div>

    <div class="vid-top">
      <video src="assets/penny/PennyClubFinal.mp4" muted loop playsinline autoplay></video>
    </div>

    <div class="orbit-stage">
      <div class="orbit" id="orbit"></div>
    </div>

    <div class="vid-bottom">
      <video src="assets/penny/ClubPennyLapDance1.mp4" muted loop playsinline autoplay></video>
    </div>

    <div class="footer">
      Planner and tools will live here.
    </div>
  </aside>

  <button class="tab" id="tab" aria-label="Open assist bar">
    <img src="assets/penny/PennyCanHelp.jpg" alt="Penny" id="tabImg">
    <video src="assets/penny/PennyShowsTheWay.mp4" muted playsinline id="tabVideo"></video>
  </button>

  <script>
    const ROUTES = [
      {icon:"🏠", label:"Housing"},
      {icon:"💼", label:"Jobs"},
      {icon:"🔄", label:"Reentry"},
      {icon:"🤝", label:"Community"},
      {icon:"🎬", label:"Media"},
      {icon:"ℹ",  label:"About"},
      {icon:"🛠", label:"Tools"},
      {icon:"📌", label:"PIN"}
    ];

    const orbit = document.getElementById('orbit');
    ROUTES.forEach((r, i) => {
      const angle = (360 / ROUTES.length) * i;
      const c = document.createElement('div');
      c.className = 'card';
      c.style.transform = `rotateY(${angle}deg) translateZ(130px)`;
      c.innerHTML = `<div class="ico">${r.icon}</div>${r.label}`;
      orbit.appendChild(c);
    });

    const fullText = "We are just cuter than Doombots, but because us girls do things better than the boys we don't need as many. Typical males. Always overcompensating for something.🙄 So Ladies, if you would like a side hustle encouraging a bunch of horny retards to empty their wallet into your purse, WildCard DEV has already been approached about this business opportunity for all you other Femme Fatale's out there! Take the Red Pill to find out all about it!";
    const typeEl = document.getElementById('typeText');
    const redPill = document.getElementById('redPill');
    let typing = false;

    function typeWriter() {
      if (typing) return;
      typing = true;
      typeEl.textContent = '';
      redPill.style.display = 'none';
      let i = 0;
      const timer = setInterval(() => {
        typeEl.textContent += fullText[i];
        i++;
        if (i >= fullText.length) {
          clearInterval(timer);
          typing = false;
          redPill.style.display = 'inline-block';
        }
      }, 28);
    }

    const tab = document.getElementById('tab');
    const bar = document.getElementById('bar');
    const overlay = document.getElementById('overlay');
    const tabVideo = document.getElementById('tabVideo');
    const tabImg = document.getElementById('tabImg');
    const ericaVideo = document.getElementById('ericaVideo');

    function open() {
      document.body.classList.add('open');
      bar.classList.add('open');
      tabImg.style.display = 'none';
      tabVideo.style.display = 'block';
      tabVideo.currentTime = 0;
      tabVideo.play().catch(() => {});
      ericaVideo.currentTime = 0;
      ericaVideo.play().catch(() => {});
      setTimeout(typeWriter, 400);
    }
    function close() {
      document.body.classList.remove('open');
      bar.classList.remove('open');
      tabVideo.pause();
      tabVideo.currentTime = 0;
      tabVideo.style.display = 'none';
      tabImg.style.display = 'block';
      ericaVideo.pause();
      ericaVideo.currentTime = 0;
      typeEl.textContent = '';
      redPill.style.display = 'none';
      typing = false;
    }

    tab.addEventListener('click', () => {
      bar.classList.contains('open') ? close() : open();
    });
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') close();
    });
  </script>
</body>
</html>
